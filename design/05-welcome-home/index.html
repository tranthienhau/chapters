<style>
        body {
            /* Fallback background if gradient isn't supported */
            background-color: #fff8f5; 
        }
        
        .hero-gradient {
            /* Terracotta to Sage Green soft linear gradient as requested */
            background: linear-gradient(135deg, rgba(193, 95, 60, 0.15) 0%, rgba(139, 158, 134, 0.15) 100%);
        }

        .book-hover-effect {
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .book-hover-effect:hover {
            transform: perspective(1000px) rotateY(-5deg) rotateX(5deg) scale(1.02);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
    </style>
</head>
<body class="bg-background min-h-screen antialiased flex flex-col font-body-base text-on-surface">
<!-- Hero Content Container -->
<main class="flex-1 flex flex-col items-center justify-center pt-safe-top pb-safe-bottom px-margin-page hero-gradient relative overflow-hidden h-screen">
<!-- Decorative elements (subtle) -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-30 mix-blend-multiply" style="background-image: radial-gradient(circle at top right, rgba(255,255,255,0.8), transparent 40%);"></div>
<div class="w-full max-w-md mx-auto flex flex-col items-center text-center z-10">
<!-- Floating Book Mockup -->
<div class="mb-stack-lg relative w-full max-w-[280px] aspect-[4/5] animate-float book-hover-effect shadow-warm-lift rounded-sm bg-surface-container-lowest p-2 border border-border-hairline">
<div class="w-full h-full bg-surface-variant relative overflow-hidden rounded-sm">
<img alt="Italy travel photo book cover" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtba0qJo1lrdI0ktta3--AEl4mIR0fYxlIlytlh1R8rzPwgS6DrFuRlUjnI7cBCgkWx9Y4JYkcK5sByzk-CG6bEWtIg20MXCHIULAKcvUr_r1i7-tZFGZid3YYe722_yM_iPRLHfTXvuV8JbE4yqYb6pH6b_ks3PAynNxbU8Ib_qrwq91IQvnNTWKYxBOMH7T0wxusTJnuuA2TjwKgnyRWUbVKcUxv61Zdz19RhAMKf42WnHzO9_CxhUA"/>
<!-- Spine shadow for realistic book feel -->
<div class="absolute top-0 left-0 bottom-0 w-8 bg-gradient-to-r from-black/20 to-transparent pointer-events-none"></div>
</div>
</div>
<!-- Typography -->
<h1 class="font-display-lg-mobile md:font-display-lg text-on-surface mb-stack-sm tracking-tight text-[#2B2622]">
                Welcome home from Italy
            </h1>
<p class="font-body-base text-text-secondary mb-stack-lg max-w-[320px]">
                While you were away we picked your 42 best photos and laid out a draft book.
            </p>
<!-- Action Area -->
<div class="w-full flex flex-col gap-stack-md mt-auto md:mt-0">
<button class="w-full h-[52px] bg-primary text-on-primary font-label-bold rounded-lg flex items-center justify-center transition-colors hover:bg-accent-pressed active:bg-accent-dark shadow-sm">
                    Review my book
                </button>
<button class="w-full h-[52px] bg-surface-sand text-[#2B2622] font-label-bold rounded-lg flex items-center justify-center border border-border-hairline transition-colors hover:bg-surface-variant">
                    Maybe later
                </button>
</div>
<!-- Caption -->
<p class="font-caption text-text-tertiary mt-stack-md uppercase tracking-wider">
                Draft ready - Rome, Florence, Amalfi
            </p>
</div>
</main>
<!-- Navigation explicitly suppressed as per rules for transactional/onboarding intent -->
<script>
        // Simple entrance animation for the text elements to stagger in smoothly
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('h1, p, button');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = `opacity 0.6s ease ${index * 0.1}s, transform 0.6s ease ${index * 0.1}s`;
                
                requestAnimationFrame(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body></html>
