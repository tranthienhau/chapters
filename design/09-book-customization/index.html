<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Customize Your Book</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#dcc1b8",
                        "tertiary-fixed-dim": "#cac6bf",
                        "surface": "#fff8f5",
                        "accent-pressed": "#9C4A2C",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "text-secondary": "#6B6259",
                        "on-tertiary-fixed": "#1d1c18",
                        "secondary-fixed": "#d4e8cd",
                        "accent-tint": "#F3E3DA",
                        "surface-variant": "#ebe1da",
                        "tertiary-container": "#77746f",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#7d2d0d",
                        "on-error": "#ffffff",
                        "text-tertiary": "#9A9088",
                        "secondary": "#51634e",
                        "surface-container-high": "#f1e6e0",
                        "on-tertiary-fixed-variant": "#484742",
                        "on-tertiary-container": "#fffbff",
                        "surface-tint": "#9c4323",
                        "tertiary-fixed": "#e6e2db",
                        "on-primary-container": "#fffbff",
                        "surface-sand": "#F2EADE",
                        "background": "#FAF5EE",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#fcf2eb",
                        "inverse-surface": "#352f2b",
                        "outline": "#89726b",
                        "border-hairline": "rgba(43,38,34,0.08)",
                        "inverse-primary": "#ffb59c",
                        "primary-fixed-dim": "#ffb59c",
                        "accent-dark": "#8F3F26",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#ffdbcf",
                        "primary": "#C15F3C",
                        "on-secondary-fixed": "#0f1f0f",
                        "on-secondary-container": "#576954",
                        "on-surface": "#2B2622",
                        "secondary-container": "#d4e8cd",
                        "inverse-on-surface": "#f9efe8",
                        "on-surface-variant": "#56423c",
                        "on-primary-fixed": "#390c00",
                        "surface-bright": "#fff8f5",
                        "on-secondary": "#ffffff",
                        "tertiary": "#5e5c57",
                        "surface-container-highest": "#ebe1da",
                        "surface-container": "#f6ece5",
                        "on-secondary-fixed-variant": "#3a4b37",
                        "surface-dim": "#e2d8d2",
                        "secondary-fixed-dim": "#b8ccb2",
                        "primary-container": "#b95936",
                        "on-background": "#1f1b17",
                        "support-sage": "#8B9E86"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "safe-bottom": "34px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "margin-page": "24px",
                        "stack-lg": "32px",
                        "safe-top": "59px"
                    },
                    "fontFamily": {
                        "display-lg": ["Fraunces"],
                        "display-lg-mobile": ["Fraunces"],
                        "label-bold": ["Inter"],
                        "caption": ["Inter"],
                        "title-md": ["Fraunces"],
                        "body-base": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "title-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    },
                    "boxShadow": {
                        "warm-soft": "0 8px 24px rgba(43, 38, 34, 0.08)"
                    }
                }
            }
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=Inter:wght@400;500;600&display=swap');
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
        }
        .soft-shadow {
            box-shadow: 0 8px 24px rgba(43, 38, 34, 0.08);
        }
    </style>
</head>
<body class="antialiased font-body-base min-h-screen flex flex-col pb-safe-bottom md:items-center">
<!-- Mobile Container (Max width for centered desktop preview) -->
<main class="w-full max-w-[393px] md:shadow-2xl md:min-h-screen md:bg-background relative">
<!-- Header -->
<header class="flex items-center justify-between px-margin-page pt-safe-top pb-stack-md bg-background sticky top-0 z-50">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface flex-1 text-center pr-[40px]">Customize your book</h1>
</header>
<!-- Content Area -->
<div class="px-margin-page flex flex-col gap-stack-lg pb-32">
<!-- Hero Element: Editable Cover Preview -->
<div class="bg-surface-container-lowest rounded-[20px] soft-shadow p-6 flex flex-col items-center">
<div class="w-full aspect-[4/5] bg-surface-variant rounded-xl overflow-hidden mb-6 relative">
<img class="w-full h-full object-cover" data-alt="A beautiful, sun-drenched coastal town in Italy with colorful houses clinging to dramatic cliffs above deep blue Mediterranean waters. The scene is shot with premium, warm, nostalgic 35mm film style photography, evoking a sophisticated travel editorial. The lighting is golden hour, casting long soft shadows." src="https://lh3.googleusercontent.com/aida/AP1WRLtba0qJo1lrdI0ktta3--AEl4mIR0fYxlIlytlh1R8rzPwgS6DrFuRlUjnI7cBCgkWx9Y4JYkcK5sByzk-CG6bEWtIg20MXCHIULAKcvUr_r1i7-tZFGZid3YYe722_yM_iPRLHfTXvuV8JbE4yqYb6pH6b_ks3PAynNxbU8Ib_qrwq91IQvnNTWKYxBOMH7T0wxusTJnuuA2TjwKgnyRWUbVKcUxv61Zdz19RhAMKf42WnHzO9_CxhUA"/>
</div>
<div class="w-full relative">
<label class="sr-only" for="book-title">Book Title</label>
<input class="w-full bg-surface-sand rounded-[14px] border-none text-center font-display-lg-mobile text-display-lg-mobile text-on-surface px-4 py-3 focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="book-title" type="text" value="Italy, Spring 2026"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-text-tertiary">edit</span>
</div>
</div>
<!-- Settings List -->
<div class="flex flex-col gap-stack-md">
<!-- Pages Stepper -->
<div class="flex items-center justify-between py-4 border-b border-border-hairline">
<span class="font-body-base text-on-surface">Pages</span>
<div class="flex items-center bg-surface-sand rounded-full p-1">
<button aria-label="Decrease pages" class="w-8 h-8 flex items-center justify-center rounded-full text-text-secondary hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<span class="font-label-bold text-label-bold px-4 w-12 text-center">28</span>
<button aria-label="Increase pages" class="w-8 h-8 flex items-center justify-center rounded-full text-text-secondary hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>
<!-- Cover Finish Selector -->
<div class="flex flex-col gap-stack-sm py-4 border-b border-border-hairline">
<span class="font-body-base text-on-surface">Cover finish</span>
<div class="flex gap-2">
<button class="px-6 py-2 rounded-full bg-accent-tint text-primary font-label-bold text-label-bold transition-colors">Matte</button>
<button class="px-6 py-2 rounded-full bg-surface-sand text-on-surface font-body-base hover:bg-surface-variant transition-colors">Linen</button>
<button class="px-6 py-2 rounded-full bg-surface-sand text-on-surface font-body-base hover:bg-surface-variant transition-colors">Glossy</button>
</div>
</div>
<!-- Size Dropdown -->
<div class="flex items-center justify-between py-4 border-b border-border-hairline">
<span class="font-body-base text-on-surface">Size</span>
<button class="flex items-center gap-2 bg-surface-sand px-4 py-2 rounded-full text-on-surface hover:bg-surface-variant transition-colors">
<span class="font-body-base">Classic (8.5 x 11")</span>
<span class="material-symbols-outlined text-[20px] text-text-secondary">expand_more</span>
</button>
</div>
</div>
<!-- Upsell Card -->
<div class="bg-accent-tint rounded-xl p-4 flex items-center justify-between shadow-sm">
<div class="flex-1 pr-4">
<p class="font-body-base text-on-surface">Add 8 extra pages for your favourite moments - <span class="font-label-bold">+£6</span></p>
</div>
<button class="px-4 py-2 bg-surface-container-lowest text-primary font-label-bold text-label-bold rounded-full shadow-sm hover:opacity-90 transition-opacity">Add</button>
</div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 w-full max-w-[393px] bg-background pt-4 pb-safe-bottom px-margin-page border-t border-border-hairline z-50">
<div class="flex justify-between items-center mb-4">
<span class="font-body-base text-text-secondary">Total</span>
<span class="font-title-md text-title-md text-on-surface">£42.00</span>
</div>
<button class="w-full h-[52px] bg-primary text-on-primary font-label-bold text-label-bold rounded-[14px] hover:bg-accent-pressed active:scale-[0.98] transition-all flex items-center justify-center">
                Continue to order
            </button>
</div>
</main>
</body></html>
